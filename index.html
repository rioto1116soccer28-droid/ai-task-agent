<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>AI Task Agent 試作品</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:22px}main{max-width:600px;margin:auto}h1{font-size:25px}p{color:#4b5563}textarea{box-sizing:border-box;width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:12px;padding:14px;min-height:100px}button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:#111827;color:white;margin-top:12px}button.secondary{background:#e5e7eb;color:#111827;margin-left:8px}.card{background:white;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 2px 10px #0001}.task{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee;align-items:center}.task:last-child{border:0}input[type=checkbox]{width:22px;height:22px}.done{text-decoration:line-through;color:#6b7280}small{color:#6b7280}#status{margin-top:12px}</style></head><body><main><h1>🤖 AI Task Agent</h1><p>目標を入力すると、実行しやすいタスクに分けます。初期版はAI APIを使わないルールベースの試作品です。</p><div class="card"><label for="goal"><strong>達成したい目標</strong></label><textarea id="goal" placeholder="例：AZ-900に合格する"></textarea><button id="generate">タスクを作成</button><button id="reset" class="secondary">リセット</button></div><section class="card" id="results" hidden><h2 id="heading">作業リスト</h2><small id="progress"></small><div id="tasks"></div><p id="status"></p></section><p><small>データはこのブラウザ内に保存されます。機密情報は入力しないでください。</small></p></main><script>
const goalEl=document.getElementById('goal'),results=document.getElementById('results'),tasksEl=document.getElementById('tasks');let state={goal:'',tasks:[],checks:[]};try{const saved=JSON.parse(localStorage.getItem('taskAgentV1'));if(saved&&Array.isArray(saved.tasks)&&Array.isArray(saved.checks))state=saved}catch(e){};
function makeTasks(goal){if(/AZ.?900|azure|資格|試験|勉強|学習/i.test(goal))return ['目標日と試験範囲を確認する','学習する項目を5つ書き出す','今日30分、最初の項目を学習する','模擬問題を10問解く','間違えた問題を復習する'];if(/筋トレ|運動|ダイエット|健康/.test(goal))return ['達成したい数値と期限を決める','週の実施日を決める','最初のメニューを作る','今日1回実施する','1週間後に記録を振り返る'];if(/旅行|出張/.test(goal))return ['日程と予算を決める','交通手段を調べる','宿泊先を比較する','予約内容を確認する','持ち物リストを作る'];return ['目標の期限と完了条件を決める','必要な情報を集める','やることを3〜5個に分ける','最初の作業を15分進める','進捗を確認して次の作業を決める']}
function save(){try{localStorage.setItem('taskAgentV1',JSON.stringify(state))}catch(e){document.getElementById('status').textContent='保存できませんでした。ブラウザの設定を確認してください。'}}
function render(){goalEl.value=state.goal;results.hidden=!state.tasks.length;tasksEl.replaceChildren();state.tasks.forEach((t,i)=>{const row=document.createElement('label');row.className='task';const check=document.createElement('input');check.type='checkbox';check.checked=!!state.checks[i];check.addEventListener('change',()=>{state.checks[i]=check.checked;save();render()});const span=document.createElement('span');span.textContent=t;if(check.checked)span.className='done';row.append(check,span);tasksEl.append(row)});const n=state.checks.filter(Boolean).length;document.getElementById('progress').textContent=`${n}/${state.tasks.length} 完了`;document.getElementById('status').textContent=state.tasks.length?(n===state.tasks.length?'すべて完了！ 次の目標を入力しましょう。':'次は未完了のタスクを1つ進めましょう。'):''}
document.getElementById('generate').addEventListener('click',()=>{const goal=goalEl.value.trim();if(!goal){alert('目標を入力してください');return}state={goal,tasks:makeTasks(goal),checks:Array(5).fill(false)};save();render()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('入力内容と進捗を消去しますか？')){state={goal:'',tasks:[],checks:[]};save();render()}});render();
</script></body></html>
